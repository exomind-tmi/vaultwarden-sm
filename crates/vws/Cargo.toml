[package]
name = "vws"
version.workspace = true
edition.workspace = true
license.workspace = true

# Companion CLI: the admin control plane for vaultwarden-sm (organizations, machine accounts,
# access tokens, project access) plus a transparent wrapper around `bws` for everything else.
[[bin]]
name = "vws"
path = "src/main.rs"

[dependencies]
sm-core = { path = "../sm-core" }
clap = { workspace = true, features = ["env"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
